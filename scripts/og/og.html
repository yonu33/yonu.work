<!doctype html>
<!--
  OGP 画像（public/og.png, 1200×630）のひな形。scripts/generate-og.mjs がブラウザで開いて撮影する。
  文言や配色を変えたら `npm run og` で作り直す。cat.png は 16×16 マスのドット絵（1 マス 8px）。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: "DotGothic16", sans-serif;
    color: #1b2f48;
    /* サイトと同じ薄い青の方眼紙 */
    background-color: #dfeaf5;
    background-image:
      linear-gradient(90deg, rgba(89, 113, 137, 0.08) 1px, transparent 1px),
      linear-gradient(rgba(89, 113, 137, 0.08) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  /* 1 マス 26px（16 マス × 26 = 416px）。輪郭がにじまないよう拡大はドットのまま */
  .cat {
    position: absolute;
    left: 88px;
    top: 107px;
    width: 416px;
    height: 416px;
    image-rendering: pixelated;
  }
  /* 切符のミシン目 */
  .perforation {
    position: absolute;
    left: 576px;
    top: 72px;
    bottom: 72px;
    border-left: 3px dashed #9db4ca;
  }
  .text {
    position: absolute;
    left: 632px;
    right: 64px;
    top: 50%;
    transform: translateY(-50%);
  }
  /* 名前を主役に（トップの切符と同じく「yonu」をいちばん大きく） */
  .name {
    font-size: 150px;
    line-height: 0.9;
    letter-spacing: 0.01em;
  }
  .lead {
    margin-top: 30px;
    font-size: 36px;
    line-height: 1.5;
  }
  /* 画像の外にドメインを出さないサービス（Discord など）向けに、サイト名も小さく添える */
  .site {
    margin-top: 22px;
    color: #176f9f;
    font-size: 26px;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
  <img class="cat" src="cat.png" alt="">
  <div class="perforation"></div>
  <div class="text">
    <p class="name">yonu</p>
    <p class="lead">作って、仲間を集めて、<br>ときどき旅に出る。</p>
    <p class="site">yonu.work</p>
  </div>
</body>
</html>
